[project]
name = "crowdsim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Suprit Sagar", email = "toxicsuprit@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
crowdsim = "crowdsim:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
